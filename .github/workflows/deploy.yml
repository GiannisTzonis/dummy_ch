# Builds the site in web/ (React Router, prerendered to static HTML) and publishes it on GitHub
# Pages at armoniachoir.org. Runs on every push to main that changes the site, or by hand from the
# Actions tab ("Run workflow").
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions" (the custom
# domain stays as it is). Switching the source back to "Deploy from a branch" restores the old
# hand-written HTML at the repository root.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one under way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # prerenders every page, then adds the search-engine tags, sitemap.xml, robots.txt and 404.html
      - run: npm run build
      # every page, image and link checked before anything is published
      - run: node scripts/legacy/check-assets.mjs build/client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
